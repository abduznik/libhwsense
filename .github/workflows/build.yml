name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build build --config Release

    - name: Create Release Archive
      run: |
        Copy-Item "WinRing0x64.sys" "build/bin/Release/"
        cd build/bin/Release
        7z a ../../hwsense-win64.zip hwsense.dll WinRing0x64.sys

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hwsense-win64
        path: build/hwsense-win64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/hwsense-win64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Release
      run: cmake --build build

    - name: Stage install tree
      run: cmake --install build --prefix dist/hwsense-linux-x64

    - name: Create Release Archive
      run: tar -czf hwsense-linux-x64.tar.gz -C dist hwsense-linux-x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hwsense-linux-x64
        path: hwsense-linux-x64.tar.gz

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: hwsense-linux-x64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
