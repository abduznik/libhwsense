name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: |
        cd libhwsense
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: |
        cd libhwsense/build
        cmake --build . --config Release

    - name: Create Release Archive
      run: |
        cd libhwsense/build/bin/Release
        7z a ../../../hwsense-win64.zip hwsense.dll WinRing0x64.sys

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hwsense-win64
        path: libhwsense/hwsense-win64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: libhwsense/hwsense-win64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
